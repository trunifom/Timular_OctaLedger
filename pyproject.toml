[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "octaledger"
version = "0.1.0.dev0"
description = "Local-first time tracking for Timeular / ZEI Bluetooth trackers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "bleak>=1,<4",
  "streamlit>=1.37,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "requests>=2.32,<3",
  "plotly>=5.24,<7",
  "pandas>=2.0,<4",  # used directly for the dashboard tables
  "platformdirs>=4,<5",
  # Windows ships no timezone database; zoneinfo needs this package there.
  "tzdata>=2024.1",
]

[project.optional-dependencies]
# Optional extras (each feature is greyed out with an explanation when its package is missing).
tray = ["pystray>=0.19.5", "pillow>=10"]  # LGPL-3.0 (pystray), loaded dynamically
toast = ["winotify>=1.1"]  # MIT
holidays = ["holidays>=0.50"]  # MIT, offline public holidays
audio = ["miniaudio>=1.60"]  # MIT; MP3/FLAC/WAV/Vorbis, no AAC
pdf = ["fpdf2>=2.8"]  # LGPL-3.0 (!), loaded only when a PDF is requested
discovery = ["zeroconf>=0.130"]  # LGPL-2.1-or-later, loaded only when a bridge search runs
ics = ["icalendar>=6", "recurring-ical-events>=3"]  # BSD-2-Clause / LGPL-3.0
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "types-requests>=2.32",
  # Required by the FastAPI/Starlette TestClient used in the API tests.
  "httpx>=0.27,<1",
  "pandas-stubs>=2.0",
]

[project.scripts]
octaledger = "octaledger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# SQL migrations are shipped inside the package.
[tool.setuptools.package-data]
"octaledger.infrastructure.storage" = ["migrations/*.sql"]
"octaledger.dashboard" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The pytest cache directory is not writable in some Windows setups and is not needed.
addopts = "-p no:cacheprovider"
# Starlette announces a future replacement of httpx in its TestClient; harmless for now.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# E/F/I: pycodestyle, pyflakes, import order. B: likely bugs. UP: modern syntax. BLE: blind
# excepts (each one carries a reason). T20: no print in library code. C4/PIE/SIM: simpler
# code. S: security smells. RUF100: stale ``noqa`` comments.
select = ["E", "F", "I", "B", "UP", "BLE", "T20", "C4", "PIE", "SIM", "S", "RUF100"]
ignore = [
  "SIM102",  # nested ``if`` is often clearer than one long condition
  "SIM117",  # nested ``with`` is clearer around savepoints/transactions
  "UP047",   # PEP 695 generics: the project keeps TypeVar for tooling compatibility
  "S101",    # ``assert`` narrows types for mypy; it is not used for validation
]

[tool.ruff.lint.per-file-ignores]
"src/octaledger/cli.py" = ["T201"]  # the command line prints by design
"scripts/**" = ["T201", "S603", "S607"]  # maintenance scripts talk to the console and to git
"tests/**" = ["S", "T20", "B008", "BLE", "SIM"]  # test code: fixtures, sockets, fake secrets

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/octaledger"]

# plotly ships neither type stubs nor a py.typed marker; only its imports are exempted.
[[tool.mypy.overrides]]
module = ["plotly", "plotly.*"]
ignore_missing_imports = true

# Optional extras (tray, toast, pdf, ics, holidays) may or may not be installed and some ship no
# type information; only their imports are exempted.
[[tool.mypy.overrides]]
module = ["pystray", "winotify", "fpdf", "fpdf.*", "icalendar", "icalendar.*", "recurring_ical_events", "holidays", "zeroconf", "miniaudio"]
ignore_missing_imports = true
