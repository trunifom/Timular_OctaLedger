[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "octaledger"
version = "0.1.0.dev0"
description = "Local-first time tracking for Timeular / ZEI Bluetooth trackers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "bleak>=1,<4",
  "streamlit>=1.37,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "requests>=2.32,<3",
  "plotly>=5.24,<7",
  "pandas>=2.0,<4",  # used directly for the dashboard tables
  "platformdirs>=4,<5",
  # Windows ships no timezone database; zoneinfo needs this package there.
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "types-requests>=2.32",
  # Required by the FastAPI/Starlette TestClient used in the API tests.
  "httpx>=0.27,<1",
  "pandas-stubs>=2.0",
]

[project.scripts]
octaledger = "octaledger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# SQL migrations are shipped inside the package.
[tool.setuptools.package-data]
"octaledger.infrastructure.storage" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The pytest cache directory is not writable in some Windows setups and is not needed.
addopts = "-p no:cacheprovider"
# Starlette announces a future replacement of httpx in its TestClient; harmless for now.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/octaledger"]

# plotly ships neither type stubs nor a py.typed marker; only its imports are exempted.
[[tool.mypy.overrides]]
module = ["plotly", "plotly.*"]
ignore_missing_imports = true
